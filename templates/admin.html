<!DOCTYPE html>
<html lang="ta">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <style>
        body { font-family: sans-serif; padding: 15px; }
        .order-box { border: 1px solid #ccc; padding: 12px; margin-bottom: 12px; border-radius: 6px; }
        select, button { padding: 6px; margin-top: 5px; }
    </style>
</head>
<body>
    <h2>Admin Dashboard - ஆர்டர்கள்</h2>
    {% for order in orders %}
    <div class="order-box">
        <p><b>Order #{{ order['id'] }}</b> | {{ order['customer_name'] }} ({{ order['phone'] }})</p>
        <p><b>பொருட்கள்:</b> {{ order['items'] }} - <b>₹{{ order['total_amount'] }}</b></p>
        <p><b>UTR:</b> {{ order['utr_number'] }} | <b>முகவரி:</b> {{ order['address'] }}</p>
        
        <form action="/update_status/{{ order['id'] }}" method="POST">
            <label>நிலை (Status):</label>
            <select name="status">
                <option value="Order Placed" {% if order['status']=='Order Placed' %}selected{% endif %}>Order Placed</option>
                <option value="Packed" {% if order['status']=='Packed' %}selected{% endif %}>Packed</option>
                <option value="Shipped" {% if order['status']=='Shipped' %}selected{% endif %}>Shipped</option>
                <option value="Delivered" {% if order['status']=='Delivered' %}selected{% endif %}>Delivered</option>
            </select>
            <button type="submit">Update</button>
        </form>
    </div>
    {% endfor %}
</body>
</html>
