<!DOCTYPE html>
<html lang="ta">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 40px 20px; }
        .box { border: 2px solid #28a745; padding: 25px; border-radius: 10px; max-width: 400px; margin: auto; }
        .btn { display: inline-block; margin-top: 15px; padding: 10px 20px; background: #007bff; color: white; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="color: #28a745;">ஆர்டர் வெற்றி! 🎉</h2>
        <p>நன்றி <b>{{ name }}</b>,</p>
        <p>உங்கள் ஆர்டர் எண் (Order ID): <b>#{{ order_id }}</b></p>
        <p>உறுதிப்படுத்தல் தகவல் உங்கள் Email-க்கு அனுப்பப்பட்டுள்ளது.</p>
        <a href="/track" class="btn">ஆர்டர் நிலையைப் பார்க்க (Track Order)</a>
        <br><br>
        <a href="/">முகப்புப் பக்கம் செல்ல</a>
    </div>
</body>
</html>
