<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panamthevai - தளம்</title>
    <style>
        /* இணையதளத்தின் பொதுவான வடிவமைப்பு (CSS) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121214; /* கார் லேப்டாப்/மொபைல் டார்க் தீம் */
            color: #e1e1e6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        /* கார்டு பாக்ஸ் டிசைன் */
        .card {
            background-color: #202024;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #323238;
            max-width: 90%;
            width: 400px;
        }

        /* தலைப்பு (Heading) */
        h1 {
            color: #00adb5; /* அழகான நியான் ப்ளூ நிறம் */
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        /* துணை உரை */
        p {
            color: #a8a8b3;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        /* பொத்தான் (Button) டிசைன் */
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background-color: #00adb5;
            color: #121214;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s ease;
        }

        /* மவுஸ் அல்லது விரல் வைக்கும் போது மாறும் நிறம் */
        .btn:hover {
            background-color: #007a80;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- இணையதளத்தின் உள்ளடக்கம் (HTML) -->
    <div class="card">
        <h1>Panamthevai</h1>
        <p>வணக்கம்! என் புதிய இணையதளத்திற்கு உங்களை வரவேற்கிறேன்.</p>
        <p>Termux மற்றும் GitHub Pages மூலம் இந்த தளம் வெற்றிகரமாக உருவாக்கப்பட்டுள்ளது.</p>
        <a href="#" class="btn">மேலும் அறிய</a>
    </div>

</body>
</html>
