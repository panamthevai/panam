<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panamthevai - தளம்</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121214;
            color: #e1e1e6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .card {
            background-color: #202024;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #323238;
            max-width: 90%;
            width: 400px;
            transition: all 0.5s ease;
        }

        h1 {
            color: #00adb5;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        p {
            color: #a8a8b3;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        /* பொத்தான் வடிவமைப்பு */
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background-color: #00adb5;
            color: #121214;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            font-size: 1rem;
            transition: 0.3s ease;
        }

        .btn:hover {
            background-color: #007a80;
            transform: translateY(-2px);
        }

        /* மறைத்து வைக்கப்பட்டுள்ள கூடுதல் விவரங்கள் பகுதி */
        .more-info {
            display: none;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #323238;
            animation: fadeIn 0.5s ease forwards;
        }

        /* சமூக ஊடக லிங்க் பட்டன்கள் */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }

        .social-btn {
            color: #00adb5;
            text-decoration: none;
            font-weight: bold;
            padding: 5px 10px;
            border: 1px solid #00adb5;
            border-radius: 5px;
            transition: 0.3s;
        }

        .social-btn:hover {
            background-color: #00adb5;
            color: #121214;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Panamthevai</h1>
        <p>வணக்கம்! என் புதிய இணையதளத்திற்கு உங்களை வரவேற்கிறேன்.</p>
        <p>Termux மற்றும் GitHub Pages மூலம் இந்த தளம் வெற்றிகரமாக உருவாக்கப்பட்டுள்ளது.</p>
        
        <!-- பட்டன் கிளிக் செய்யும்போது வேலை செய்ய ஜாவாஸ்கிரிப்ட் இணைக்கப்பட்டுள்ளது -->
        <button class="btn" id="learnMoreBtn">மேலும் அறிய</button>

        <!-- ஆரம்பத்தில் மறைந்திருக்கும் பகுதி -->
        <div class="more-info" id="infoSection">
            <h3>என்னைப் பற்றி:</h3>
            <p>நான் மொபைல் மூலமாகவே கோடிங் மற்றும் இணையதளங்களை உருவாக்கக் கற்றுக் கொண்டு வருகிறேன்!</p>
            <div class="social-links">
                <!-- இங்கு உங்களுடைய உண்மையான லிங்குகளை '#'க்கு பதில் மாற்றி வைக்கலாம் -->
                <a href="#" class="social-btn">YouTube</a>
                <a href="#" class="social-btn">GitHub</a>
            </div>
        </div>
    </div>

    <!-- பட்டன் வேலை செய்வதற்கான JavaScript குறியீடு -->
    <script>
        const btn = document.getElementById('learnMoreBtn');
        const info = document.getElementById('infoSection');

        btn.addEventListener('click', function() {
            if (info.style.display === 'none' || info.style.display === '') {
                info.style.display = 'block';
                btn.textContent = 'சுருக்குக'; // பட்டன் பெயரை மாற்றும்
            } else {
                info.style.display = 'none';
                btn.textContent = 'மேலும் அறிய';
            }
        });
    </script>

</body>
</html>
