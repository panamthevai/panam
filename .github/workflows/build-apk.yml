name: Build Custom Termux Tool APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest # கிட்ஹப் சர்வர் கணினி (மொபைல் ஆப் அல்ல)

    steps:
    - name: Checkout Your Panam Project
      uses: actions/checkout@v4
      with:
        path: panam-src

    - name: Checkout Official Termux App Source
      uses: actions/checkout@v4
      with:
        repository: 'termux/termux-app'
        path: termux-app

    - name: Inject Web View UI and Scripts
      run: |
        cd termux-app
        # உங்கள் டூலின் கோப்புகளை டெர்மக்ஸ் ஆப்பிற்குள் கச்சிதமாக இணைக்கும் பகுதி
        mkdir -p app/src/main/assets/boot
        mkdir -p app/src/main/assets/html
        
        # உங்கள் index.html மற்றும் ஸ்கிரிப்ட்களை ஆப்பிற்குள் காப்பி செய்கிறது
        cp -r ../panam-src/index.html app/src/main/assets/html/
        cp -r ../panam-src/style.css app/src/main/assets/html/ 2>/dev/null || true
        cp -r ../panam-src/scripts/* app/src/main/assets/boot/ 2>/dev/null || true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build Android Native APK
      run: |
        cd termux-app
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload Your Custom APK
      uses: actions/upload-artifact@v4
      with:
        name: PanamApp-Native-Termux
        path: termux-app/app/build/outputs/apk/debug/app-debug.apk
