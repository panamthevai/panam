name: Auto Build Termux Repo

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install dpkg-dev
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev
      - name: Generate Packages.gz
        run: |
          dpkg-scanpackages -m . /dev/null > Packages
          gzip -k -f Packages
      - name: Commit & Push Repo Index
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Panam Auto-Builder"
          git add Packages Packages.gz
          git commit -m "Auto-update APT Packages index" || exit 0
          git push
