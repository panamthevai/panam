name: Build Advanced Light APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create Complete Android Project from Scratch
      run: |
        echo "Creating Native Android WebView Project Structure..."
        mkdir -p android-app/app/src/main/java/com/panam/mirror
        mkdir -p android-app/app/src/main/res/layout
        mkdir -p android-app/app/src/main/res/values

        # 1. Create settings.gradle
        echo "include ':app'" > android-app/settings.gradle

        # 2. Create Root build.gradle
        cat << 'EOF' > android-app/build.gradle
        buildscript {
            repositories { google() \n mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
        }
        allprojects {
            repositories { google() \n mavenCentral() }
        }
        EOF

        # 3. Create App build.gradle (Optimized for size < 5MB)
        cat << 'EOF' > android-app/app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.panam.mirror'
            compileSdk 34
            defaultConfig {
                applicationId "com.panam.mirror"
                minSdk 21
                targetSdk 34
                versionCode 1
                versionName "1.0.0"
            }
            buildTypes {
                release {
                    minifyEnabled true
                    shrinkResources true
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
                }
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
        }
        EOF

        # 4. Create AndroidManifest.xml (With Internet & Advanced Permissions)
        cat << 'EOF' > android-app/app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://android.com">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <application
                android:label="Panam Mirror"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar"
                android:usesCleartextTraffic="true">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 5. Create Advanced UI Layout (With Progress Bar)
        cat << 'EOF' > android-app/app/src/main/res/layout/activity_main.xml
        <RelativeLayout xmlns:android="http://android.com"
            android:layout_width="match_滿足"
            android:layout_height="match_parent">
            <WebView
                android:id="@+id/webview"
                android:layout_width="match_parent"
                android:layout_height="match_parent" />
            <ProgressBar
                android:id="@+id/progressBar"
                style="?android:attr/progressBarStyleHorizontal"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:layout_alignParentTop="true"
                android:visibility="gone" />
        </RelativeLayout>
        EOF

        # 6. Create Advanced Java Source Code (Back button support, JavaScript, Progress bar)
        cat << 'EOF' > android-app/app/src/main/java/com/panam/mirror/MainActivity.java
        package com.panam.mirror;

        import android.os.Bundle;
        import android.view.View;
        import android.webkit.WebChromeClient;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import android.widget.ProgressBar;
        import androidx.appcompat.app.AppCompatActivity;

        public class MainActivity extends AppCompatActivity {
            private WebView myWebView;
            private ProgressBar progressBar;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(BundlesavedInstanceState);
                setContentView(R.layout.activity_main);

                myWebView = findViewById(R.id.webview);
                progressBar = findViewById(R.id.progressBar);

                WebSettings webSettings = myWebView.getSettings();
                webSettings.setJavaScriptEnabled(true); // Advanced Feature: Enable JavaScript
                webSettings.setDomStorageEnabled(true);  // Storage support

                myWebView.setWebViewClient(new WebViewClient());
                
                // Advanced Feature: Show loading progress bar
                myWebView.setWebChromeClient(new WebChromeClient() {
                    @Override
                    public void onProgressChanged(WebView view, int newProgress) {
                        if (newProgress == 100) {
                            progressBar.setVisibility(View.GONE);
                        } else {
                            progressBar.setVisibility(View.VISIBLE);
                            progressBar.setProgress(newProgress);
                        }
                    }
                });

                // உங்களது மிரர் சர்வர் லோக்கல் இண்டெக்ஸ் பக்கத்தை லோடு செய்கிறது
                myWebView.loadUrl("https://github.io");
            }

            // Advanced Feature: போன் பேக் பட்டன் அழுத்தினால் ஆப் மூடாமல், வெப்சைட் பின்னாடி போகும்
            @Override
            public void onBackPressed() {
                if (myWebView.canGoBack()) {
                    myWebView.goBack();
                } else {
                    super.onBackPressed();
                }
            }
        }
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.5

    - name: Build Advanced Optimized APK
      run: |
        cd android-app
        gradle assembleRelease --no-daemon

    - name: Upload Super Light APK
      uses: actions/upload-artifact@v4
      with:
        name: Panam-Advanced-Light-APK
        path: android-app/app/build/outputs/apk/release/*.apk
