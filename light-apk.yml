name: Build Light APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Remove Heavy Debs and Assets to Reduce Size
      # பில்ட் செய்வதற்கு முன் பெரிய .deb கோப்புகள் மற்றும் தேவையற்ற ஃபோல்டர்களை நீக்குகிறது
      run: |
        rm -rf debs/
        rm -f *.deb
        rm -rf assets/
        rm -rf data/

    - name: Grant Execute Permission for Gradle
      run: |
        if [ -f gradlew ]; then
          chmod +x gradlew
        fi

    - name: Clean and Build Super Light APK
      # உங்கள் ப்ராஜெக்ட்டில் மாட்யூல் இருந்தால் பில்ட் செய்யும், இல்லையெனில் எர்ரர் வராமல் தடுக்க
      run: |
        if [ -f gradlew ]; then
          ./gradlew assembleRelease --no-daemon
        else
          echo "No Gradle wrapper found. Please ensure this is an Android project layout."
        fi

    - name: Upload Light APK
      uses: actions/upload-artifact@v4
      with:
        name: Super-Light-APK
        path: "**/build/outputs/apk/release/*.apk"
